name: replayguard
description: >-
  Check AWS Lambda durable functions for replay-determinism bugs, and annotate
  the pull request that introduced them.
branding:
  icon: shield
  color: orange

inputs:
  path:
    description: Directory or file to check.
    required: false
    default: "."
  fail-on:
    description: Exit non-zero at or above this severity - error, warning, note, or never.
    required: false
    default: error
  upload-sarif:
    description: >-
      Upload results to GitHub code scanning, which annotates findings inline on
      the pull request. Needs `security-events: write`.
    required: false
    default: "true"
  version:
    description: Version specifier to install, e.g. "==0.1.0". Empty installs the latest.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install replayguard
      shell: bash
      # `[all]` rather than the bare package: without the parsers, TypeScript,
      # Java and Rust files are skipped with a note, and a green check that
      # silently analysed only the Python would be worse than no check at all.
      run: python -m pip install "replayguard[all]${{ inputs.version }}"

    - name: Check for determinism violations
      id: check
      shell: bash
      # Never let a non-zero exit stop the SARIF upload -- the annotations are
      # the useful output, and losing them on the runs that have findings would
      # defeat the point. The gate is re-applied after the upload.
      run: |
        set +e
        replayguard check "${{ inputs.path }}" \
          --format sarif -o replayguard.sarif
        replayguard check "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && hashFiles('replayguard.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: replayguard.sarif
        category: replayguard

    - name: Apply the gate
      shell: bash
      run: exit ${{ steps.check.outputs.exit_code }}
