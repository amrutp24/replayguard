name: publish

# Publishing runs on a published GitHub Release, not on a tag push, so
# creating a release is the single deliberate act that ships a version.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff build

      - name: Verify before shipping
        # A release is built from whatever commit was tagged, which is not
        # necessarily a commit CI has seen. Re-running the gate here is what
        # stops a broken artifact reaching PyPI, where it cannot be replaced.
        run: python scripts/verify.py

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies a short-lived OIDC token issued to
      # this workflow, so no API token exists to leak, rotate, or commit.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
