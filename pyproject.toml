[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replayguard"
version = "0.1.1"
description = "Determinism checker for AWS Lambda durable functions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amrut Pagidipally", email = "amrut.pagidipally@gmail.com" }]
keywords = [
    "aws",
    "lambda",
    "durable-functions",
    "determinism",
    "linter",
    "static-analysis",
    "upgrade-safety",
    "replay",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/amrutp24/replayguard"
Issues = "https://github.com/amrutp24/replayguard/issues"

[project.optional-dependencies]
typescript = ["tree-sitter>=0.25", "tree-sitter-typescript>=0.23"]
java = ["tree-sitter>=0.25", "tree-sitter-java>=0.23"]
rust = ["tree-sitter>=0.25", "tree-sitter-rust>=0.23"]
dynamic = [
    "aws-durable-execution-sdk-python>=1.7",
    "aws-durable-execution-sdk-python-testing>=1.2",
]
# `replayguard drift` is stdlib-only on purpose -- a tool that warns about
# dependency drift should not arrive with a dependency tree. Only the live
# `probe`, which deploys to a real account, needs a client.
live = ["boto3>=1.35"]
all = [
    "boto3>=1.35",
    "tree-sitter>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-rust>=0.23",
    "aws-durable-execution-sdk-python>=1.7",
    "aws-durable-execution-sdk-python-testing>=1.2",
]
dev = [
    "boto3>=1.35",
    "pytest>=8",
    "pytest-cov>=5",
    "tree-sitter>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-rust>=0.23",
    "aws-durable-execution-sdk-python>=1.7",
    "aws-durable-execution-sdk-python-testing>=1.2",
]

[project.scripts]
replayguard = "replayguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/replayguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# `fail_under` in [tool.coverage.report] only prints; it does not change
# pytest's exit code, so the floor sat there for weeks reporting FAIL while the
# gate went green. Passing it as a pytest option is what actually enforces it.
addopts = "--cov-fail-under=91"

[tool.coverage.run]
source = ["replayguard"]
branch = true
# Three modules in the live probe provision and delete real IAM roles, Lambda
# functions and DynamoDB tables. They cannot be unit tested without either an
# AWS account or a mock detailed enough that it would be testing the mock --
# and the whole point of the probe is that the platform's behaviour is not
# something you can assert from a fixture. They are exercised by
# `replayguard probe` against a real account, which is a stronger check than a
# mock would give, and the evidence lives in drift-study/.
#
# Excluded rather than allowed to drag the floor down, so that 90 keeps meaning
# something for every module that CAN be tested. Everything else in probe/ --
# the scenario matrix, the handler template, the findings renderer -- is tested
# normally and included here.
omit = [
    "*/replayguard/probe/infra.py",
    "*/replayguard/probe/deploy.py",
    "*/replayguard/probe/runner.py",
]

[tool.coverage.report]
# Two decimals, because the floor is compared against the *rounded*
# figure. At precision 0 anything from 89.5 up counts as 90, so the
# report printed FAIL while the run exited 0.
precision = 2
# Branch coverage, so this is stricter than the line-coverage figure.
#
# 88 is the measured value with meaningful tests, not a target. An earlier 90
# was guessed before anything had been measured and is corrected here rather
# than met by padding the suite -- a coverage floor exists to catch regression,
# and a floor set at the honest current value does that job. What remains
# uncovered is overwhelmingly defensive null-guards in the tree-sitter
# frontends (`if node is None: return None`), which are hard to reach without
# contrived input and low value to force.
#
# Ratchets UP only. If a change raises coverage, raise this with it.
fail_under = 91
show_missing = true

[tool.ruff]
line-length = 92
# Fixtures are deliberately broken code -- unused variables and dead
# assignments are the point of them, so linting them is meaningless.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # UP042 wants StrEnum over `str, Enum`. Declined: the two differ in
    # __str__, the code relies on explicit .value throughout, and the change
    # would be churn with no behavioural gain.
    "UP042",
]
